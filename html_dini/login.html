<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
    }
    .login-box {
        width: 350px;
        margin: 120px auto;
        background-color: white;
        padding: 30px;
    }
    h2 {
        text-align: center;
        color: #4e065c;
    }
    label {
        display: block;
        margin-top: 15px;
    }
    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
    }
    button {
        width: 100%;
        padding: 11px;
        margin-top: 20px;
        border: none;
        border-radius: 6px;
        background-color: #4e065c;
        color: white;
        cursor: pointer;
    }
    button:hover {
        background-color: #4e065c;
    }
</style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>
    <form action="dashboard.html">
        <label>Username</label>
        <input type="text" placeholder="Masukkan username">
        <label>Password</label>
        <input type="password" placeholder="Masukkan password">
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
